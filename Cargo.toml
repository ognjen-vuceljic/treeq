[package]
name = "treeq"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A keyboard-driven tree view for JSON and XML, in your terminal"
repository = "https://github.com/ognjen-vuceljic/treeq"
readme = "README.md"
keywords = ["json", "xml", "tui", "cli", "tree"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# NOTE: serde_yaml is marked deprecated upstream with no actively maintained
# successor as of writing. It's the only mature YAML crate for this use case;
# revisit if a maintained replacement (e.g. `serde_yml` or similar) matures.
serde_yaml = "0.9"
roxmltree = "0.20"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
# `use-dev-tty`: without it, crossterm's default Unix event backend (mio +
# kqueue) fails to register a freshly-opened `/dev/tty` fd on macOS with
# EINVAL, which is exactly the fd it must fall back to for keyboard input
# when stdin is piped (e.g. `some-cli | treeq`). The alternate backend this
# feature selects uses a plain poll(2) call instead and doesn't have that
# problem. See issue #85.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
