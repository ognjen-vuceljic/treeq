[package]
name = "treeq"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A keyboard-driven tree view for JSON and XML, in your terminal"
repository = "https://github.com/ognjen-vuceljic/treeq"
readme = "README.md"
keywords = ["json", "xml", "tui", "cli", "tree"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# NOTE: serde_yaml is marked deprecated upstream with no actively maintained
# successor as of writing. It's the only mature YAML crate for this use case;
# revisit if a maintained replacement (e.g. `serde_yml` or similar) matures.
serde_yaml = "0.9"
roxmltree = "0.20"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
